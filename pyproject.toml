[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-metamavericks_env"
version = "0.1.0"
description = "Metamavericks Env environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "imageio>=2.0.0",
    "gymnasium>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["metamavericks_env", "server"]
package-dir = { "metamavericks_env" = "metamavericks_env", "server" = "server" }
